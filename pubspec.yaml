name: personal_os
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  alarm: ^5.2.1
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  cloud_firestore: ^6.6.0
  firebase_auth: ^6.5.4
  google_sign_in: ^7.2.0
  intl: any
  shared_preferences: ^2.5.5
  file_picker: ^11.0.2
