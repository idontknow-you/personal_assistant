  audioplayers: ^6.1.0
  http: ^1.2.2
  flutter_markdown: ^0.7.4+3
  crypto: ^3.0.3
  local_auth: ^2.3.0

dependency_overrides:
  flutter_fgbg: 0.6.0

dev_dependencies:
